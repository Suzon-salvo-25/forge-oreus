<style>
/* Layout : une colonne de conversation centrée, sombre, inspirée d'oreus.ai ; choix en pastilles cliquables */
:root{

}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}

.thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:10px;max-width:92%}
.bot{align-self:flex-start}

  var a=S.analyse, txt="Voici ce que je comprends de votre processus :\n"+a.resume;
  if(a.constats.length) txt+="\n\nCe que vos documents m'ont appris :\n- "+a.constats.join("\n- ");
  txt+="\n\nC'est bien ça ? Si oui, répondez à ces questions dans un seul message :\n"+a.questions.map(function(q,i){ return (i+1)+". "+q; }).join("\n");
  t.textContent=txt; S.phase="questions"; scrollEnd();
  input.placeholder="Vos réponses, par exemple : 1. … 2. …"; input.focus();
}
function answerQuestions(t){
  S.history.push({q:S.analyse.questions.join(" / "), r:t});
  input.placeholder="Écrivez votre message…";
  draft();
}
function lineCheck(text){
  var lines=String(text).split("\n"), avr=0, nos=0;
  lines.forEach(function(l){ if(/\[À vérifier/i.test(l)) avr++; else if(/\d/.test(l) && !/source/i.test(l) && !/^#/.test(l.trim())) nos++; });
  return {avr:avr, nos:nos};
}
function draft(){
  S.phase="draft";
  var m=bot(null), t=thinking(m);
  if(offline()){ var txt=cannedDraft(); t.classList.remove("thinking"); t.textContent=txt; finish(txt); return; }
  ctl=new AbortController();
  var p="Tu es FORGE, l'agent de découverte d'Oréus. "+RULES+"\n"+ctxText()+"\n\nRéponses de la personne à tes questions : "+S.history.map(function(h){ return h.r; }).join(" | ")+
    "\n\nÉcris un BROUILLON COURT de ce que l'agent produirait, en reprenant la structure du dernier livrable de la personne (titres de sections précédés de « ## »). Chaque ligne qui contient un chiffre se termine par sa source entre parenthèses (fichier et onglet, ou « votre réponse »). Ce qui manque est écrit « [À vérifier : ...] ». Toute section stratégique (perspectives, orientations) contient seulement « [À compléter par la direction] ». Commence par la ligne « Brouillon à relire. Rien n'est envoyé sans votre relecture. » Pas d'autre texte.\n\n"+docsText();
  sample(p,{signal:ctl.signal, cache:false, onText:function(u){ t.classList.remove("thinking"); t.textContent=u.text; scrollEnd(); }}).then(function(r){ t.textContent=r.text; finish(r.text); }).catch(function(e){ if(e&&e.code==="cancelled") return; iaFail(t,e); });
}
function cannedDraft(){ return "Brouillon à relire. Rien n'est envoyé sans votre relecture.\n## 1. Présentation du centre\nLe centre social Les Tilleuls accueille les habitants du quartier autour de trois axes : parentalité, jeunesse et lien social. L'équipe compte [À vérifier : effectifs 2025].\n## 2. Public accueilli\nEn 2025, le centre a accueilli 438 personnes différentes (source : fréquentation 2025, onglet Inscrits).\n## 3. Actions menées\n12 actions ont été réalisées, dont 3 hors les murs (source : tableau des actions 2025).\nL'aide aux devoirs reste l'atelier le plus fréquenté, avec 442 passages (source : fréquentation 2025, onglet Passages).\n[À vérifier : participants des sorties familles, absents de la fréquentation.]\n## 4. Partenaires\n[À vérifier : partenaires 2025.]\n## 5. Perspectives\n[À compléter par la direction]"; }

function ficheText(fromDocs){
  var s=sec(), d=S.agent, b=d?(BRIQUE[d.brique_oreus]||["Vox Studio"])[0]:"à définir";
  var fi=S.fiche;
  var L=["CAHIER DES CHARGES · POUR L'ÉQUIPE ORÉUS"];
  if(fi){ L.push("Organisation : "+fi.entreprise+" (SIREN "+fi.siren+") · code "+fi.code+" · "+fi.source); if(S.correction) L.push("Correction apportée par la personne : "+S.correction); }
  L=L.concat(["Secteur : "+(s?s.nom:(fi&&fi.reclassement?fi.reclassement:"autre (voir description)"))+" · Taille : "+(S.taille||"?")+" · Rôle : "+(S.role?S.role.label:"?"),
    "Tâche : "+(d?d.nom:S.libre),
    "Agent proposé : "+(d?"« "+d.nom+" »":"à définir")+" · "+b,
    "Entrées : "+((d&&(d.entrees||[]).map(function(e){return e.nom;}).join(", "))||"à préciser")+(S.docs.length?" · exemples reçus : "+S.docs.map(function(x){return x.name;}).join(", "):""),
    "Sortie : "+((d&&(d.sorties||[]).map(function(e){return e.nom;}).join(", "))||"à préciser")]);
  if(fromDocs && S.analyse){ L.push("Processus compris : "+S.analyse.resume); if(S.analyse.constats.length) L.push("Constats : "+S.analyse.constats.join(" / ")); }
  if(S.history.length) L.push("Réponses du client : "+S.history.map(function(h){return h.r;}).join(" | "));
  var cl=cadrageLines(); if(cl.length){ L.push(""); L.push("CADRAGE (déclaré par la personne)"); cl.forEach(function(x){ L.push("- "+x); }); L.push(""); }
  if(S.cadrage&&/^Oui/.test(S.cadrage.sensibles||"")) L.push("Données personnelles : oui → anonymisation ou pseudonymisation avant traitement, analyse d'impact à envisager avec le délégué à la protection des données.");
  if(S.cadrage&&/obligatoire/.test(S.cadrage.hebergement||"")) L.push("Hébergement : en France obligatoire → infrastructure Oréus en France (à confirmer pour chaque brique).");
  L.push("Lignes rouges : "+LIGNES_ROUGES.join(" "));
  L.push("Tests à programmer : chaque total du brouillon égal au calcul depuis les fichiers ; chaque chiffre cite sa source ; sections stratégiques = [À compléter par la direction] ; aucune donnée personnelle.");
  L.push("Points ouverts : "+(fromDocs?"les [À vérifier] du brouillon ; partie technique (stockage, accès, hébergement, durée de conservation) avec l'informatique et le délégué à la protection des données.":"documents non fournis ; processus à confirmer en rendez-vous ; partie technique à voir avec l'informatique."));
  L.push("Gain : à mesurer après la mise en service.");
  return L.join("\n");
}
function finish(text){
  var c=lineCheck(text);
  var m=bot("J'ai vérifié le brouillon par un contrôle simple : "+c.avr+" point"+(c.avr>1?"s":"")+" à vérifier par vous"+(c.nos?", et "+c.nos+" ligne"+(c.nos>1?"s":"")+" chiffrée"+(c.nos>1?"s":"")+" sans source":"")+".\nVoici le cadrage à transmettre à l'équipe Oréus pour construire votre agent.");
  showFiche(m, ficheText(true));
}
function finishNoDocs(){ S.phase="fin"; var m=bot("Entendu. Voici le cadrage établi à partir de vos choix. Un rendez-vous court suffira pour confirmer le processus."); showFiche(m, ficheText(false)); }
function showFiche(m, txt){
  m.insertBefore(el("div","sub","Votre cahier des charges est prêt. Relisez-le, puis envoyez-le à l'équipe Oréus : rien ne part sans votre clic."), null);
  S.phase="fin"; var pre=el("pre","fiche",txt); m.appendChild(pre);
  var items=[{label:"Envoyer à l'équipe Oréus", send:true},{label:"Copier la fiche", copy:true}]; if(downloads) items.push({label:"Télécharger la fiche", dl:true}); items.push({label:"Recommencer avec un autre besoin", again:true});
  var box=el("div","chips"); items.forEach(function(it){ var b=el("button","chip",it.label); b.type="button"; b.addEventListener("click", function(){
    if(it.copy){ try{ navigator.clipboard.writeText(txt).then(function(){ b.textContent="Copiée ✓"; },function(){ b.textContent="Sélectionnez le texte pour copier"; }); }catch(e){ b.textContent="Sélectionnez le texte pour copier"; } }
    if(it.dl){ downloads.save({filename:"cahier-des-charges-forge.txt", data:txt}).then(function(){ b.textContent="Proposée ✓"; },function(){ b.textContent="Téléchargement refusé"; }); }
    if(it.send){ transmettre(txt, b); }
    if(it.again){ start(); }
  }); box.appendChild(b); });
  m.appendChild(box); scrollEnd();
}
/* envoi du cahier : prépare un e-mail dans la messagerie de la personne (rien ne part sans elle) */
var EQUIPE="salvosuzon@gmail.com", db=null;
function transmettre(txt, b){
  var fi=S.fiche||{}, sujet="Cahier des charges FORGE"+(fi.entreprise?" · "+fi.entreprise:"")+(fi.code?" · "+fi.code:"");
  function mail(){ var corps=txt.length>1800? txt.slice(0,1800)+"\n[… fiche complète : utilisez « Copier la fiche » et collez-la ici]" : txt;
    window.open("mailto:"+EQUIPE+"?subject="+encodeURIComponent(sujet)+"&body="+encodeURIComponent(corps), "_blank"); b.textContent="Message préparé dans votre messagerie"; }
  if(!db){ mail(); return; }
  b.disabled=true; b.textContent="Envoi…";
  db.collection("cahiers").doc("c-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)).set({ code:fi.code||null, siren:fi.siren||null, entreprise:fi.entreprise||null, texte:txt, cadrage:S.cadrage||{}, agent:S.agent?S.agent.nom:null, at:new Date().toISOString() })
    .then(function(){ b.textContent="Envoyé à l'équipe Oréus ✓"; }, function(){ b.disabled=false; mail(); });
}
function askLibre(q){ S.phase="libre"; bot(q); input.focus(); }
function libreReply(){
  var m=bot(null), t=thinking(m);
  if(offline()){ t.classList.remove("thinking"); t.textContent="Merci. Je note votre besoin pour l'équipe Oréus."; S.agent=null; showFiche(m, ficheText(false)); return; }
  var p="Tu es FORGE, l'agent de découverte d'Oréus. "+RULES+"\nLa personne décrit son activité et sa tâche répétitive : « "+S.libre+" ».\nPropose en 6 lignes au plus : un agent possible (nom, ce qu'il ferait, ce dont il aurait besoin), la brique Oréus (Vox Chat pour un assistant à qui l'on pose des questions, Vox Studio pour un agent qui produit un livrable à partir de fichiers), puis une seule question pour préciser.";
  ctl=new AbortController();
  sample(p,{signal:ctl.signal, cache:false, onText:function(u){ t.classList.remove("thinking"); t.textContent=u.text; scrollEnd(); }}).then(function(r){ t.textContent=r.text; S.phase="fin"; S.history.push({q:"besoin", r:S.libre}); }).catch(function(e){ if(e&&e.code==="cancelled") return; iaFail(t,e); });
}
function followUp(txt){
  var m=bot(null), t=thinking(m);
  if(offline()){ t.classList.remove("thinking"); t.textContent="Noté. Je l'ajoute aux points ouverts pour l'équipe Oréus."; return; }
  var p="Tu es FORGE, l'agent de découverte d'Oréus. "+RULES+"\n"+ctxText()+"\nLa conversation est terminée et la fiche a été transmise. La personne ajoute : « "+txt+" ». Réponds en 4 lignes au plus.";
  ctl=new AbortController();
  sample(p,{signal:ctl.signal, cache:false, onText:function(u){ t.classList.remove("thinking"); t.textContent=u.text; scrollEnd(); }}).catch(function(e){ if(e&&e.code==="cancelled") return; iaFail(t,e); });
}

document.getElementById("restart").addEventListener("click", function(){ if(ctl) ctl.abort(); start(); });
start();
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("sample").then(function(s){ sample=s; if(!s) document.getElementById("offline").checked=true; }).catch(function(){ document.getElementById("offline").checked=true; });
  window.claude.use("downloads").then(function(d){ downloads=d; }).catch(function(){});
} else { /* page publique hors de claude.ai : parcours sans IA, sans les réglages de démonstration */
  var o=document.getElementById("offline"); o.checked=true; o.parentNode.style.display="none"; var tg=document.querySelector(".tag"); if(tg) tg.style.display="none"; }
})();
</script>

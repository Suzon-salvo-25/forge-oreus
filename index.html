<style>
/* Layout : une colonne de conversation centrée, sombre, inspirée d'oreus.ai ; choix en pastilles cliquables */
:root{

}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}

.thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:10px;max-width:92%}
.bot{align-self:flex-start}

function chips(m, items, onPick, opts){
  opts=opts||{}; var box=el("div","chips"+(opts.col?" col":"")); var picked=[];
  items.forEach(function(it){
    var b=el("button","chip"); b.type="button"; b.textContent=it.label; if(it.detail){ b.appendChild(el("small",null,it.detail)); }
    b.addEventListener("click", function(){
      if(box.dataset.done) return;
      if(opts.multi && !it.exclusive){ var i=picked.indexOf(it); if(i>=0){ picked.splice(i,1); b.setAttribute("aria-pressed","false"); } else if(picked.length<(opts.max||2)){ picked.push(it); b.setAttribute("aria-pressed","true"); } ok.disabled=!picked.length; return; }
      box.dataset.done="1"; b.setAttribute("aria-pressed","true"); me(it.label); onPick(it);
    });
    box.appendChild(b);
  });
  var ok=null;
  if(opts.multi){ ok=el("button","go","Valider"); ok.type="button"; ok.disabled=true; ok.addEventListener("click", function(){ if(box.dataset.done||!picked.length) return; box.dataset.done="1"; me(picked.map(function(p){return p.label;}).join(" · ")); onPick(picked); }); box.appendChild(ok); }
  m.appendChild(box); scrollEnd(); return box;
}

function start(){
  thread.textContent=""; reset();
  var m=bot("Bonjour. Pour ouvrir votre démonstration personnalisée, saisissez le code reçu dans notre e-mail.");
  var f=el("form","codebox"); var lab=el("label",null,"Code d'accès"); lab.htmlFor="code"; lab.style.position="absolute"; lab.style.left="-9999px";
  var inp=el("input"); inp.id="code"; inp.autocomplete="off"; inp.placeholder="Exemple : ABCDEF-1234"; inp.spellcheck=false;
  var ok=el("button","go","Ouvrir"); ok.type="submit"; f.appendChild(lab); f.appendChild(inp); f.appendChild(ok); m.appendChild(f);
  var err=el("div","sub",""); m.appendChild(err);
  f.addEventListener("submit", function(e){ e.preventDefault(); var c=inp.value.trim(); if(!c) return; ok.disabled=true; err.textContent="Vérification…";
    unlock(c).then(function(fi){ ok.disabled=false; if(!fi){ err.textContent="Ce code ne correspond à aucune démonstration. Vérifiez-le dans l'e-mail, ou continuez sans code."; return; } f.remove(); err.remove(); me("Code "+c.toUpperCase()); startFiche(fi); })
      .catch(function(){ ok.disabled=false; err.textContent="Impossible de vérifier le code dans ce navigateur. Continuez sans code."; }); });
  chips(m,[{label:"Je n'ai pas de code"}], function(){ f.remove(); err.remove(); genericStart(); });
  setTimeout(function(){ inp.focus(); }, 50);
}
function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function unlock(code){
  var norm=code.trim().toUpperCase().replace(/\s+/g,""), enc=new TextEncoder();
  var mat=await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveKey"]);
  /* tiroir : 2 caractères de l'empreinte du code (256 tiroirs) — on ne dérive la clé que pour les fiches du même tiroir */
  var dig=new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("forge|"+norm)));
  var tiroir=("0"+dig[0].toString(16)).slice(-2);
  var cand=FICHES.fiches.filter(function(e){ return e.h===tiroir; }).concat(FICHES.fiches.filter(function(e){ return !e.h; }));
  for(var i=0;i<cand.length;i++){
    var e=cand[i];
    try{
      var key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(e.salt), iterations:e.iter||FICHES.iter, hash:"SHA-256"}, mat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(x){}
  }
  return null;
}
function cap(s){ s=String(s||"").toLowerCase(); return s.replace(/(^|[\s-])\S/g, function(x){ return x.toUpperCase(); }); }
function startFiche(fi){
  S.fiche=fi; S.secteur=CAT.some(function(c){ return c.id===fi.secteur; })?fi.secteur:null; S.taille=fi.tranche; S.role={label:fi.role, id:"cible", dirs:fi.dirs||[]};
  bot("Bonjour, je suis FORGE, l'assistant d'Oréus.\nMon rôle : comprendre sur quoi vous travaillez, pour vous proposer les agents qu'Oréus peut mettre en place chez vous.\nQuelques clics, puis, si vous le souhaitez, un ou deux documents.");
  cadrage(0,"general");
}
function askPistes(){
  S.phase="douleurs"; var fi=S.fiche;
  var hs=fi.hypotheses.filter(function(h){ return h.statut!=="affaiblie"; }).slice(0,3);
  var m=bot("Pour une organisation comme la vôtre, voici les situations qui prennent souvent du temps. Vous reconnaissez-vous ? Vous pouvez en choisir deux.");
  var items=hs.map(function(h){ return {label:h.nom, detail:trunc(h.scene,170)+"\nPiste "+h.statut_lisible+".", d:h}; });
  (fi.surprises||[]).slice(0,1).forEach(function(s){ items.push({label:s.nom, detail:trunc(s.scene,170)+"\nPiste repérée par notre enquête, à vérifier avec vous.", d:{nom:s.nom, scene:s.scene, direction:s.direction, entrees:[], sorties:[], brique_oreus:"vox_studio", confirmerait:[], tuerait:[]}}); });
  items.push({label:"Aucune de celles-ci", exclusive:true, none:true});
  chips(m, items, function(r){
    if(!Array.isArray(r)){ askLibre("D'accord. Quelle tâche répétitive vous prend le plus de temps en ce moment ? Racontez-moi la dernière fois que vous l'avez faite."); return; }
    S.douleurs=r.map(function(x){ return x.d; }); proposeAgents();
  }, {multi:true, max:2, col:true});
}
function genericStart(){
  bot("Bonjour, je suis FORGE.\nMon rôle est de comprendre sur quoi vous travaillez, pour vous proposer les agents qu'Oréus peut mettre en place chez vous.\nQuelques clics, puis, si vous le souhaitez, un ou deux documents.");
  askSecteur();
}
function askSecteur(){
  S.phase="secteur";
  var m=bot("Dans quel secteur travaillez-vous ?");
  var items=ORDER.map(function(id){ return {label:SECTEUR_LABEL[id], id:id}; }); items.push({label:"Autre secteur", id:"autre"});
  chips(m, items, function(it){ if(it.id==="autre"){ S.secteur=null; askLibre("Pas de souci. Décrivez en une phrase votre activité et la tâche répétitive qui vous prend le plus de temps."); return; } S.secteur=it.id; askTaille(); });
}
function askTaille(){
  S.phase="taille";
  var m=bot("Combien de personnes travaillent dans votre structure ?");
  chips(m, TAILLES.map(function(t){ return {label:t[1], id:t[0]}; }), function(it){ S.taille=it.id; askRole(); });
}
function askRole(){
  S.phase="role";
  var dirs={}; sec().douleurs.forEach(function(d){ dirs[d.direction]=1; });
  var items=ROLES.filter(function(r){ return r[2].some(function(x){ return dirs[x]; }); }).map(function(r){ return {label:r[1], id:r[0], dirs:r[2]}; });
  items.push({label:"Autre rôle", id:"autre", dirs:[]});
  var m=bot("Quel est votre rôle ?");
  chips(m, items, function(it){ S.role=it; cadrage(0,"general"); });
}
function askDouleurs(){
  S.phase="douleurs";
  var all=sec().douleurs, mine=all.filter(function(d){ return S.role.dirs.indexOf(d.direction)>=0; });
  var list=(mine.length?mine:all).slice(0,4);
  var m=bot("Vous reconnaissez-vous dans l'une de ces situations ? Vous pouvez en choisir deux.");
  var items=list.map(function(d){ var pal=(d.paliers&&d.paliers[S.taille])||""; return {label:d.nom, detail:trunc(d.scene,170)+(pal?"\nÀ votre taille : "+pal:""), d:d}; });
  if(mine.length && mine.length<all.length) items.push({label:"Voir d'autres situations du secteur", exclusive:true, more:true});
  items.push({label:"Aucune de celles-ci", exclusive:true, none:true});
  chips(m, items, function(r){
    if(!Array.isArray(r)){ if(r.more){ S.role={label:S.role.label,id:S.role.id,dirs:[]}; askDouleurs(); return; } askLibre("D'accord. Quelle tâche répétitive vous prend le plus de temps en ce moment ? Racontez-moi la dernière fois que vous l'avez faite."); return; }
    S.douleurs=r.map(function(x){ return x.d; }); proposeAgents();
  }, {multi:true, max:2, col:true});
}
function agentCard(d){

  c.appendChild(el("h3",null,"Agent « "+d.nom+" »"));
  var b=BRIQUE[d.brique_oreus]||["Vox Studio",""];

  c.appendChild(el("div","k","Ce qu'il ferait"));

  c.appendChild(el("div",null, ins? "Il part de : "+ins+".\nIl produit : "+outs+"." : "Il part de vos documents de travail sur ce sujet et prépare le livrable à votre place, en citant ses sources."));
  c.appendChild(el("div","k","Ce dont il aurait besoin"));
  c.appendChild(el("div",null,"Un ou deux exemples réels"+(ins?" : "+ins:"")+", et le dernier livrable que vous avez produit."));
  c.appendChild(el("div","k","Lignes rouges"));
  LIGNES_ROUGES.forEach(function(l){ c.appendChild(el("div","red",l)); });
  return c;
}
function proposeAgents(){
  S.phase="agents";
  var m=bot(S.douleurs.length>1?"Voici les deux agents qui répondraient à ces situations. Lequel voulez-vous ajuster d'abord ?":"Voici l'agent qui répondrait à cette situation.");
  S.douleurs.forEach(function(d){ m.appendChild(agentCard(d)); });
  var items=S.douleurs.map(function(d){ return {label:"Ajuster l'agent « "+d.nom+" »", d:d}; });
  items.push({label:"Continuer sans déposer de documents", none:true});
  chips(m, items, function(it){ S.agent=it.none?S.douleurs[0]:it.d; S.skipDocs=!!it.none; cadrage(0,"tache"); }, {col:true});
}
function askDocs(){
  S.phase="docs";
  var d=S.agent;
  var m=bot("Montrez-moi votre vrai travail : déposez 1 à 3 documents avec le trombone (fichiers texte ou CSV), ou collez leur texte dans le message.\nIdéalement : le dernier livrable, et les fichiers d'où viennent ses chiffres."+(d.question_commercial?"\n\nPour vous situer : "+d.question_commercial:""));
  var items=[{label:"Envoyer mes documents", send:true}];
  if(S.secteur==="association_sociale" && /financeur/i.test(d.nom)) items.unshift({label:"Utiliser les documents d'exemple (centre social fictif)", ex:true});
  items.push({label:"Je préfère ne pas en déposer", none:true});
  var box=chips(m, items, function(it){
    if(it.ex){ S.docs=EXAMPLE_DOCS.slice(); S.docs.forEach(showDoc); analyse(); return; }
    if(it.none){ finishNoDocs(); return; }
    if(!S.docs.length){ bot("Je n'ai encore reçu aucun document. Utilisez le trombone, ou collez le texte dans le message puis envoyez-le."); askDocsAgain(); return; }
    analyse();
  }, {col:true});
}
function askDocsAgain(){ var m=bot(null); chips(m,[{label:"Analyser les documents reçus", send:true},{label:"Je préfère ne pas en déposer", none:true}], function(it){ if(it.none){ finishNoDocs(); return; } if(!S.docs.length){ bot("Toujours aucun document reçu."); askDocsAgain(); return; } analyse(); }); }
function showDoc(d){ var m=me(""); m.firstChild.textContent="Document : "+d.name; var p=el("div","doc",d.text.slice(0,1500)); m.appendChild(p); }


/* ---------- cadrage : questions du cahier des charges (le code pose, la personne choisit) ---------- */
var OUTILS = {
  finance:["Tableurs (Excel, Google Sheets)","Logiciel comptable ou de facturation","ERP","Portails clients ou fournisseurs","E-mail et PDF","Papier"],
  achats:["Tableurs (Excel, Google Sheets)","ERP","Portails fournisseurs","E-mail et PDF","Papier"],
  operations:["Tableurs (Excel, Google Sheets)","Logiciel métier ou ERP","Outil de planning","E-mail et PDF","Téléphone","Papier"],
  direction:["Tableurs (Excel, Google Sheets)","Traitement de texte (Word)","Plateformes des financeurs ou de l'État","E-mail et PDF","Papier"],
  rh:["Logiciel de paie ou SIRH","Tableurs (Excel, Google Sheets)","Outil de planning","E-mail et téléphone","Papier"],
  qualite:["Logiciel qualité ou GED","Tableurs (Excel, Google Sheets)","Traitement de texte (Word)","E-mail et PDF","Papier"],
  commercial:["CRM","Tableurs (Excel, Google Sheets)","Traitement de texte (Word)","Plateformes d'appels d'offres","E-mail et PDF"],
  marketing:["Réseaux sociaux","Outil de publication ou CMS","Traitement de texte (Word)","Tableurs (Excel, Google Sheets)"],
  informatique:["Outil de tickets","Base de connaissances ou wiki","E-mail et messagerie","Tableurs (Excel, Google Sheets)"]
};
function questionsCadrage(part){
  var dir=(part==="general")? ((S.role&&S.role.dirs&&S.role.dirs[0])||"operations") : ((S.agent&&S.agent.direction)||"operations");
  var outils=OUTILS[dir]||OUTILS.operations;
  if(part==="general") return [
    {k:"outils", q:"Quels outils utilisez-vous au quotidien dans votre métier ? Plusieurs choix possibles.", opts:outils.concat(["Autre outil"]), multi:true, max:4},
    {k:"charge", q:"Quelle part de votre semaine passez-vous sur des tâches administratives ou répétitives ?", opts:["Moins de 10 %","10 à 25 %","25 à 50 %","Plus de la moitié"]},
    {k:"stockage", q:"Où se trouvent principalement vos documents et vos données ? Plusieurs choix possibles.", opts:["Sur les postes de travail","Sur un serveur interne","Dans un cloud (Microsoft, Google…)","Dans un logiciel métier en ligne","Sur papier","Je ne sais pas"], multi:true, max:3},
    {k:"sensibles", q:"Manipulez-vous des informations personnelles sur des personnes (bénéficiaires, patients, salariés, clients) ?", opts:["Oui","Non","Je ne sais pas"]},
    {k:"hebergement", q:"Avez-vous une exigence d'hébergement des données en France ?", opts:["Oui, obligatoire","Souhaitable","Non","Je ne sais pas"]}
  ];
  return [
    {k:"outils_tache", q:"Pour cette tâche précisément, quels outils utilisez-vous ? Plusieurs choix possibles.", opts:outils.concat(["Autre outil"]), multi:true, max:4},
    {k:"frequence", q:"À quelle fréquence faites-vous cette tâche ?", opts:["Chaque jour","Chaque semaine","Chaque mois","Quelques fois par an"]},
    {k:"volume", q:"Combien de dossiers, documents ou demandes cela représente-t-il par mois ?", opts:["Moins de 10","10 à 50","50 à 200","Plus de 200","Je ne sais pas"]},
    {k:"duree", q:"Combien de temps prend une occurrence, du début à la fin ?", opts:["Moins de 30 minutes","1 à 2 heures","Une demi-journée","Plusieurs jours","Je ne sais pas"]},
    {k:"personnes", q:"Combien de personnes y participent ?", opts:["Une seule","2 à 3","4 à 10","Plus de 10"]},
    {k:"validation", q:"Qui doit valider le résultat avant qu'il parte ?", opts:["Moi","Mon responsable","La direction","Un comité ou un partenaire"]},
    {k:"succes", q:"Dans trois mois, qu'est-ce qui ferait de cet agent une réussite ? Deux choix au plus.", opts:["Gagner du temps","Moins d'erreurs","Respecter les délais","Avoir des données à jour","Libérer l'équipe pour autre chose"], multi:true, max:2}
  ];
}
function cadrage(i, part){
  part=part||"tache"; var Q=questionsCadrage(part);
  if(!S.cadrage) S.cadrage={};
  if(i===0) bot(part==="general"? "Pour commencer, quelques questions rapides sur votre façon de travailler. Ce sont des clics ; vous pouvez aussi écrire votre réponse." : "Pour préparer le cahier des charges de cet agent, quelques questions sur cette tâche.");
  if(i>=Q.length){
    if(part==="general"){ if(S.fiche) askPistes(); else askDouleurs(); return; }
    S.phase="cadrage_fin"; if(S.skipDocs){ finishNoDocs(); } else { askDocs(); } return;
  }
  var q=Q[i]; S.phase="cadrage"; S.cadrageIdx=i; S.cadragePart=part;
  var m=bot((i+1)+"/"+Q.length+" · "+q.q);
  chips(m, q.opts.map(function(o){ return {label:o}; }), function(r){
    if(S.cadrageIdx!==i || S.cadragePart!==part) return;
    S.cadrage[q.k]=Array.isArray(r)? r.map(function(x){ return x.label; }).join(", ") : r.label;
    cadrage(i+1, part);
  }, q.multi?{multi:true, max:q.max||2}:{});
}
var CADRAGE_LABELS={outils:"Outils du métier",charge:"Part du temps sur des tâches répétitives",stockage:"Emplacement des données",sensibles:"Données personnelles",hebergement:"Hébergement en France",outils_tache:"Outils utilisés pour la tâche",frequence:"Fréquence",volume:"Volume mensuel",duree:"Durée d'une occurrence",personnes:"Personnes impliquées",validation:"Validation avant envoi",succes:"Critères de réussite"};
function cadrageLines(){ var c=S.cadrage||{}; return Object.keys(CADRAGE_LABELS).filter(function(k){ return c[k]; }).map(function(k){ return CADRAGE_LABELS[k]+" : "+c[k]; }); }

function analyse(){
  S.phase="analyse";
  var m=bot(null), t=thinking(m);
  if(offline()){
    if(S.docs.some(function(d){ return EXAMPLE_DOCS.indexOf(d)>=0; })){ S.analyse=cannedAnalyse(); renderAnalyse(t); return; }
    t.classList.remove("thinking"); t.textContent="Documents bien reçus. L'équipe Oréus les analysera avec vous lors de l'échange."; S.phase="fin"; showFiche(m, ficheText(false)); return;
  }
  ctl=new AbortController();
  var p="Tu es FORGE, l'agent de découverte d'Oréus. "+RULES+"\n"+ctxText()+"\n\nLis les documents ci-dessous. Réponds UNIQUEMENT avec ce JSON :\n{\"resume\":\"le processus compris, en 3 phrases courtes : d'où viennent les chiffres, quelles transformations, quel livrable\",\"constats\":[\"au plus 2 constats concrets tirés des documents (une incohérence, un manque), chacun citant le document\"],\"questions\":[\"au plus 2 questions sur ce que les documents ne disent pas\"]}\n\n"+docsText();
  sample.json(p,{signal:ctl.signal}).then(function(r){
    if(!r||typeof r.resume!=="string") throw {code:"invalid_json"};
    S.analyse={resume:r.resume, constats:(r.constats||[]).slice(0,2), questions:(r.questions||[]).slice(0,2)}; renderAnalyse(t);
  }).catch(function(e){ if(e&&e.code==="cancelled") return; iaFail(t,e); var b=bot(null); chips(b,[{label:"Réessayer"}],function(){ analyse(); }); });

function cannedAnalyse(){ return { resume:"Votre bilan reprend chaque année le même plan en 5 sections. Le public vient de l'onglet Inscrits (personnes différentes), les actions du tableau des actions, la fréquentation de l'onglet Passages. Le livrable est un bilan par financeur.", constats:["Les sorties familles ont 0 passage dans la fréquentation, mais apparaissent dans le tableau des actions.","Le tableau 2025 compte 12 actions, contre 31 annoncées dans le bilan 2024."], questions:["Le tableau des actions 2025 est-il complet ?","Comment comptez-vous les « familles » dans le pourcentage du public ?"] }; }
function renderAnalyse(t){
  t.classList.remove("thinking");

  if(a.constats.length) txt+="\n\nCe que vos documents m'ont appris :\n- "+a.constats.join("\n- ");
  txt+="\n\nC'est bien ça ? Si oui, répondez à ces questions dans un seul message :\n"+a.questions.map(function(q,i){ return (i+1)+". "+q; }).join("\n");
  t.textContent=txt; S.phase="questions"; scrollEnd();
  input.placeholder="Vos réponses, par exemple : 1. … 2. …"; input.focus();
}
function answerQuestions(t){
  S.history.push({q:S.analyse.questions.join(" / "), r:t});

function lineCheck(text){
  var lines=String(text).split("\n"), avr=0, nos=0;
  lines.forEach(function(l){ if(/\[À vérifier/i.test(l)) avr++; else if(/\d/.test(l) && !/source/i.test(l) && !/^#/.test(l.trim())) nos++; });
  return {avr:avr, nos:nos};
}
function draft(){
  S.phase="draft";
  var m=bot(null), t=thinking(m);
  if(offline()){ var txt=cannedDraft(); t.classList.remove("thinking"); t.textContent=txt; finish(txt); return; }
  ctl=new AbortController();
  var p="Tu es FORGE, l'agent de découverte d'Oréus. "+RULES+"\n"+ctxText()+"\n\nRéponses de la personne à tes questions : "+S.history.map(function(h){ return h.r; }).join(" | ")+
    "\n\nÉcris un BROUILLON COURT de ce que l'agent produirait, en reprenant la structure du dernier livrable de la personne (titres de sections précédés de « ## »). Chaque ligne qui contient un chiffre se termine par sa source entre parenthèses (fichier et onglet, ou « votre réponse »). Ce qui manque est écrit « [À vérifier : ...] ». Toute section stratégique (perspectives, orientations) contient seulement « [À compléter par la direction] ». Commence par la ligne « Brouillon à relire. Rien n'est envoyé sans votre relecture. » Pas d'autre texte.\n\n"+docsText();
  sample(p,{signal:ctl.signal, cache:false, onText:function(u){ t.classList.remove("thinking"); t.textContent=u.text; scrollEnd(); }}).then(function(r){ t.textContent=r.text; finish(r.text); }).catch(function(e){ if(e&&e.code==="cancelled") return; iaFail(t,e); });
}
function cannedDraft(){ return "Brouillon à relire. Rien n'est envoyé sans votre relecture.\n## 1. Présentation du centre\nLe centre social Les Tilleuls accueille les habitants du quartier autour de trois axes : parentalité, jeunesse et lien social. L'équipe compte [À vérifier : effectifs 2025].\n## 2. Public accueilli\nEn 2025, le centre a accueilli 438 personnes différentes (source : fréquentation 2025, onglet Inscrits).\n## 3. Actions menées\n12 actions ont été réalisées, dont 3 hors les murs (source : tableau des actions 2025).\nL'aide aux devoirs reste l'atelier le plus fréquenté, avec 442 passages (source : fréquentation 2025, onglet Passages).\n[À vérifier : participants des sorties familles, absents de la fréquentation.]\n## 4. Partenaires\n[À vérifier : partenaires 2025.]\n## 5. Perspectives\n[À compléter par la direction]"; }

function ficheText(fromDocs){
  var s=sec(), d=S.agent, b=d?(BRIQUE[d.brique_oreus]||["Vox Studio"])[0]:"à définir";
  var fi=S.fiche;
  var L=["CAHIER DES CHARGES · POUR L'ÉQUIPE ORÉUS"];
  if(fi){ L.push("Organisation : "+fi.entreprise+" (SIREN "+fi.siren+") · code "+fi.code+" · "+fi.source); if(S.correction) L.push("Correction apportée par la personne : "+S.correction); }
  L=L.concat(["Secteur : "+(s?s.nom:(fi&&fi.reclassement?fi.reclassement:"autre (voir description)"))+" · Taille : "+(S.taille||"?")+" · Rôle : "+(S.role?S.role.label:"?"),
    "Tâche : "+(d?d.nom:S.libre),
    "Agent proposé : "+(d?"« "+d.nom+" »":"à définir")+" · "+b,
    "Entrées : "+((d&&(d.entrees||[]).map(function(e){return e.nom;}).join(", "))||"à préciser")+(S.docs.length?" · exemples reçus : "+S.docs.map(function(x){return x.name;}).join(", "):""),
    "Sortie : "+((d&&(d.sorties||[]).map(function(e){return e.nom;}).join(", "))||"à préciser")]);
  if(fromDocs && S.analyse){ L.push("Processus compris : "+S.analyse.resume); if(S.analyse.constats.length) L.push("Constats : "+S.analyse.constats.join(" / ")); }
  if(S.history.length) L.push("Réponses du client : "+S.history.map(function(h){return h.r;}).join(" | "));
  var cl=cadrageLines(); if(cl.length){ L.push(""); L.push("CADRAGE (déclaré par la personne)"); cl.forEach(function(x){ L.push("- "+x); }); L.push(""); }
  if(S.cadrage&&/^Oui/.test(S.cadrage.sensibles||"")) L.push("Données personnelles : oui → anonymisation ou pseudonymisation avant traitement, analyse d'impact à envisager avec le délégué à la protection des données.");
  if(S.cadrage&&/obligatoire/.test(S.cadrage.hebergement||"")) L.push("Hébergement : en France obligatoire → infrastructure Oréus en France (à confirmer pour chaque brique).");
  L.push("Lignes rouges : "+LIGNES_ROUGES.join(" "));
  L.push("Tests à programmer : chaque total du brouillon égal au calcul depuis les fichiers ; chaque chiffre cite sa source ; sections stratégiques = [À compléter par la direction] ; aucune donnée personnelle.");
  L.push("Points ouverts : "+(fromDocs?"les [À vérifier] du brouillon ; partie technique (stockage, accès, hébergement, durée de conservation) avec l'informatique et le délégué à la protection des données.":"documents non fournis ; processus à confirmer en rendez-vous ; partie technique à voir avec l'informatique."));
  L.push("Gain : à mesurer après la mise en service.");
  return L.join("\n");
}
function finish(text){
  var c=lineCheck(text);
  var m=bot("J'ai vérifié le brouillon par un contrôle simple : "+c.avr+" point"+(c.avr>1?"s":"")+" à vérifier par vous"+(c.nos?", et "+c.nos+" ligne"+(c.nos>1?"s":"")+" chiffrée"+(c.nos>1?"s":"")+" sans source":"")+".\nVoici le cadrage à transmettre à l'équipe Oréus pour construire votre agent.");
  showFiche(m, ficheText(true));
}
function finishNoDocs(){ S.phase="fin"; var m=bot("Entendu. Voici le cadrage établi à partir de vos choix. Un rendez-vous court suffira pour confirmer le processus."); showFiche(m, ficheText(false)); }
function showFiche(m, txt){
  m.insertBefore(el("div","sub","Votre cahier des charges est prêt. Relisez-le, puis envoyez-le à l'équipe Oréus : rien ne part sans votre clic."), null);
  S.phase="fin"; var pre=el("pre","fiche",txt); m.appendChild(pre);
  var items=[{label:"Envoyer à l'équipe Oréus", send:true},{label:"Copier la fiche", copy:true}]; if(downloads) items.push({label:"Télécharger la fiche", dl:true}); items.push({label:"Recommencer avec un autre besoin", again:true});
  var box=el("div","chips"); items.forEach(function(it){ var b=el("button","chip",it.label); b.type="button"; b.addEventListener("click", function(){
    if(it.copy){ try{ navigator.clipboard.writeText(txt).then(function(){ b.textContent="Copiée ✓"; },function(){ b.textContent="Sélectionnez le texte pour copier"; }); }catch(e){ b.textContent="Sélectionnez le texte pour copier"; } }
    if(it.dl){ downloads.save({filename:"cahier-des-charges-forge.txt", data:txt}).then(function(){ b.textContent="Proposée ✓"; },function(){ b.textContent="Téléchargement refusé"; }); }

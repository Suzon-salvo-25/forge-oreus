.who{font-size:11px;letter-spacing:.14em;color:var(--muted)}

<script>

  rh:["Logiciel de paie ou SIRH","Tableurs (Excel, Google Sheets)","Outil de planning","E-mail et téléphone","Papier"],
  qualite:["Logiciel qualité ou GED","Tableurs (Excel, Google Sheets)","Traitement de texte (Word)","E-mail et PDF","Papier"],

};
var LABELS={secteur:"Secteur",taille:"Taille",role:"Rôle",situation:"Situation reconnue",frequence:"Fréquence",volume:"Volume mensuel",duree:"Durée d'une occurrence",charge:"Part du temps sur des tâches répétitives",outils_tache:"Outils utilisés pour la tâche",validation:"Validation avant envoi",succes:"Critères de réussite",stockage:"Emplacement des données",sensibles:"Données personnelles",hebergement:"Hébergement en France",prefere:"Agent à voir en premier"};

var S;
function reset(){ S={ fiche:null, secteur:null, taille:null, role:null, agent:null, extras:[], nonReconnu:false, rep:{}, palier:0, idx:0, envoi:null }; }
var thread=document.getElementById("thread"), main=document.getElementById("main");
function el(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=String(x); return n; }
function scrollEnd(){ main.scrollTop=main.scrollHeight; }
function bot(text){ var m=el("div","msg bot"); m.appendChild(el("div","who","FORGE")); if(text!=null){ m.appendChild(el("div","bubble",text)); } thread.appendChild(m); scrollEnd(); return m; }
function me(text){ var m=el("div","msg me"); m.appendChild(el("div","bubble",text)); thread.appendChild(m); scrollEnd(); return m; }
function chips(m, items, onPick, opts){
  opts=opts||{}; var box=el("div","chips"+(opts.col?" col":"")); var picked=[];
  items.forEach(function(it){
    var b=el("button","chip"); b.type="button"; b.textContent=it.label; if(it.detail){ b.appendChild(el("small",null,it.detail)); }
    b.addEventListener("click", function(){
      if(box.dataset.done) return;
      if(opts.multi && !it.exclusive){ var i=picked.indexOf(it); if(i>=0){ picked.splice(i,1); b.setAttribute("aria-pressed","false"); } else if(picked.length<(opts.max||2)){ picked.push(it); b.setAttribute("aria-pressed","true"); } ok.disabled=!picked.length; return; }
      box.dataset.done="1"; b.setAttribute("aria-pressed","true"); me(it.label); onPick(it);
    });
    box.appendChild(b);
  });
  var ok=null;
  if(opts.multi){ ok=el("button","go","Valider"); ok.type="button"; ok.disabled=true; ok.addEventListener("click", function(){ if(box.dataset.done||!picked.length) return; box.dataset.done="1"; me(picked.map(function(p){return p.label;}).join(" · ")); onPick(picked); }); box.appendChild(ok); }
  m.appendChild(box); scrollEnd(); return box;
}
function sec(){ return CAT.find(function(c){ return c.id===S.secteur; }); }
function trunc(s,n){ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n? s.slice(0,n-1).replace(/\s\S*$/,"")+"…" : s; }
function low1(s){ s=String(s||""); return s.charAt(0).toLowerCase()+s.slice(1); }

/* ---------- accès : le code arrive directement par le lien de l'e-mail (…/#CODE), sinon on le saisit ---------- */
function codeDuLien(){ var h=decodeURIComponent((location.hash||"").replace(/^#/,"")).trim().toUpperCase().replace(/\s+/g,""); return /^[A-Z]{6}-\d{4}$/.test(h)? h : null; }
function start(){
  thread.textContent=""; reset(); progress();
  var c=codeDuLien();
  if(c){ var m=bot("Ouverture de votre espace…"); unlock(c).then(function(fi){ m.remove(); if(fi) startFiche(fi); else askCode("Ce lien ne correspond à aucun espace. Vérifiez le code indiqué dans l'e-mail."); }).catch(function(){ m.remove(); askCode("Impossible d'ouvrir votre espace dans ce navigateur. Saisissez le code de l'e-mail."); }); return; }
  askCode(null);
}
function askCode(msg){
  var m=bot(msg||"Bonjour. Pour ouvrir votre espace personnalisé, saisissez le code reçu dans notre e-mail.");
  var f=el("form","codebox"); var lab=el("label",null,"Code d'accès"); lab.htmlFor="code"; lab.style.position="absolute"; lab.style.left="-9999px";
  var inp=el("input"); inp.id="code"; inp.autocomplete="off"; inp.placeholder="Exemple : ABCDEF-1234"; inp.spellcheck=false;
  var ok=el("button","go","Ouvrir"); ok.type="submit"; f.appendChild(lab); f.appendChild(inp); f.appendChild(ok); m.appendChild(f);
  var err=el("div","sub",""); m.appendChild(err);
  f.addEventListener("submit", function(e){ e.preventDefault(); var c=inp.value.trim(); if(!c) return; ok.disabled=true; err.textContent="Vérification…";
    unlock(c).then(function(fi){ ok.disabled=false; if(!fi){ err.textContent="Ce code ne correspond à aucun espace. Vérifiez-le dans l'e-mail, ou continuez sans code."; return; } f.remove(); err.remove(); me("Code "+c.toUpperCase()); startFiche(fi); })
      .catch(function(){ ok.disabled=false; err.textContent="Impossible de vérifier le code dans ce navigateur. Continuez sans code."; }); });
  chips(m,[{label:"Je n'ai pas de code"}], function(){ f.remove(); err.remove(); genericStart(); });
  setTimeout(function(){ inp.focus(); }, 50);
}
function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function unlock(code){
  var norm=code.trim().toUpperCase().replace(/\s+/g,""), enc=new TextEncoder();
  var mat=await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveKey"]);
  /* tiroir : 2 caractères de l'empreinte du code (256 tiroirs) — on ne dérive la clé que pour les fiches du même tiroir */
  var dig=new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("forge|"+norm)));
  var tiroir=("0"+dig[0].toString(16)).slice(-2);
  var cand=FICHES.fiches.filter(function(e){ return e.h===tiroir; }).concat(FICHES.fiches.filter(function(e){ return !e.h; }));
  for(var i=0;i<cand.length;i++){
    var e=cand[i];
    try{
      var key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(e.salt), iterations:e.iter||FICHES.iter, hash:"SHA-256"}, mat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(x){}
  }
  return null;
}
function startFiche(fi){
  S.fiche=fi; S.secteur=CAT.some(function(c){ return c.id===fi.secteur; })?fi.secteur:null; S.taille=fi.tranche; S.role={label:fi.role, id:"cible", dirs:fi.dirs||[]};
  bot("Bonjour"+(fi.entreprise?" et bienvenue, "+fi.entreprise:"")+".\nJe suis FORGE, l'assistant d'Oréus. En quelques clics, découvrez les agents qu'Oréus peut mettre en place chez vous.\nQuelques questions, uniquement des clics.");
  document.getElementById("hint").textContent="Uniquement des clics, aucun document à fournir. Vos réponses sont transmises à l'équipe Oréus à chaque palier, pour préparer votre démonstration. · FORGE, conçu par Lola pour Oréus.";

}
function genericStart(){

  S.parcours=PARCOURS_LIBRE; S.palier=0; S.idx=0; next();
}

/* ---------- pistes et agents ---------- */
function norm(d){ return {nom:d.nom, scene:d.scene, direction:d.direction, brique_oreus:d.brique_oreus, sorties:d.sorties||[], entrees:d.entrees||[]}; }
function catalogueFor(dirs){
  var src=sec()? sec().douleurs : CAT.reduce(function(a,c){ return a.concat(c.douleurs); },[]);
  var mine=src.filter(function(d){ return !dirs||!dirs.length||dirs.indexOf(d.direction)>=0; });
  return mine.concat(src.filter(function(d){ return mine.indexOf(d)<0; }));
}
function pistes(){
  var out=[], vus={};
  function add(d){ var k=String(d.nom||"").toLowerCase(); if(!k||vus[k]) return; vus[k]=1; out.push(norm(d)); }
  if(S.fiche) (S.fiche.hypotheses||[]).filter(function(h){ return h.statut!=="affaiblie"; }).forEach(add);
  catalogueFor(S.role&&S.role.dirs).forEach(add);
  if(out.length<4) CAT.forEach(function(c){ c.douleurs.forEach(add); });
  return out;
}
/* rôle en une phrase pour les pistes du Radar (les pistes du catalogue de Lola utilisent leur livrable) */
var ROLE_AGENT={
  "collecte et contrôle des pièces d'entrée en relation client":"Vérifie que chaque dossier client est complet et liste les pièces manquantes à demander.",
  "collecte et contrôle des variables de paie":"Rassemble les variables du mois et signale les écarts avant l'envoi en paie.",
  "conformité et preuves qualité":"Rassemble les preuves attendues pour chaque exigence et prépare le dossier d'audit.",
  "constitution administrative des dossiers patients ou usagers":"Vérifie la complétude des dossiers administratifs et prépare les relances de pièces.",
  "constitution et suivi des dossiers de sinistre":"Monte le dossier de chaque sinistre, suit les pièces reçues et prépare les relances.",
  "contrats, dossiers et documents":"Prépare vos contrats et courriers à partir de vos modèles et retrouve la bonne version.",
  "demandes d'achat et comparaison de devis fournisseurs":"Met les devis côte à côte et prépare un tableau comparatif à valider.",
  "demandes entrantes et support":"Trie les demandes reçues, propose une réponse et oriente vers la bonne personne.",
  "facturation et relances":"Repère les factures en retard et prépare les relances, prêtes à valider.",
  "factures fournisseurs et achats":"Contrôle chaque facture fournisseur face à la commande et signale les écarts.",
  "inscriptions et complétude des dossiers d'élèves":"Vérifie chaque dossier d'inscription et prépare les demandes de pièces manquantes.",
  "instruction des réclamations et préparation des réponses":"Résume chaque réclamation, rassemble l'historique et propose une réponse à valider.",
  "planification et temps de travail":"Prépare les plannings à partir des contraintes de l'équipe et signale les conflits.",
  "qualification des demandes de maintenance":"Qualifie chaque demande de maintenance, fixe sa priorité et l'oriente vers le bon technicien.",
  "réponses aux appels d'offres ou à projets":"Analyse le dossier de consultation et prépare une première trame de réponse à partir de vos références.",
  "reporting aux financeurs ou clients":"Rassemble vos chiffres et prépare le rapport au format attendu par chaque financeur ou client."
};
function role(d){
  var r=ROLE_AGENT[cle(d)]; if(r) return r;
  if(d.brique_oreus==="vox_chat") return "Répond aux questions de vos équipes sur ce sujet, à partir de vos propres documents.";
  var s=(d.sorties&&d.sorties[0]&&d.sorties[0].nom);
  return s? "Prépare "+low1(s)+" à partir de vos fichiers ; vous relisez et validez." : "Prend en charge « "+low1(d.nom)+" » à partir de vos fichiers ; vous relisez et validez.";
}
/* ce que l'agent reçoit et ce qu'il remet, pour les pistes du Radar (les pistes du catalogue de Lola ont leurs entrées et sorties) */
var IO_AGENT={
  "collecte et contrôle des pièces d'entrée en relation client":["les pièces envoyées par vos clients et votre liste de pièces attendues","l'état de chaque dossier et les demandes de pièces prêtes à envoyer"],
  "collecte et contrôle des variables de paie":["les absences, heures et primes du mois, telles que vous les recevez","un récapitulatif contrôlé, avec les écarts à vérifier"],
  "conformité et preuves qualité":["votre référentiel et vos documents qualité","un tableau exigence par exigence, avec la preuve et ce qui manque"],
  "constitution administrative des dossiers patients ou usagers":["les pièces reçues et la liste des pièces obligatoires","l'état de chaque dossier et les relances de pièces manquantes"],
  "constitution et suivi des dossiers de sinistre":["les déclarations, photos et justificatifs reçus","un dossier ordonné, la liste des pièces manquantes et les relances"],

  "demandes d'achat et comparaison de devis fournisseurs":["les devis reçus en PDF ou par e-mail","un tableau comparatif et une note de recommandation à valider"],

  "facturation et relances":["vos factures et l'état des paiements","la liste des retards et des relances rédigées, prêtes à valider"],
  "factures fournisseurs et achats":["les factures fournisseurs et les bons de commande","les factures conformes, et les écarts à traiter"],
  "inscriptions et complétude des dossiers d'élèves":["les dossiers d'inscription reçus","l'état de chaque dossier et les demandes de pièces manquantes"],
  "instruction des réclamations et préparation des réponses":["la réclamation et l'historique du dossier","un résumé et un projet de réponse à valider"],

  "qualification des demandes de maintenance":["les demandes reçues (e-mail, formulaire, téléphone retranscrit)","chaque demande qualifiée, priorisée et orientée"],

  "reporting aux financeurs ou clients":["vos tableaux de suivi et le modèle attendu","le rapport rempli, chaque chiffre avec sa source"]
};
function cle(d){ return String(d.nom||"").toLowerCase().replace(/’/g,"'"); }
function agentCard(d, isNew){
  var c=el("div","card"+(isNew?" new":""));
  c.appendChild(el("div","k",(BRIQUE[d.brique_oreus]||"Vox Studio").toUpperCase()));
  c.appendChild(el("h3",null,d.nom)); c.appendChild(el("p",null,role(d)));
  var io=IO_AGENT[cle(d)]||[], ent=(d.entrees||[]).map(function(e){ return e.nom; }).join(", ")||io[0], sor=(d.sorties||[]).map(function(e){ return e.nom; }).join(", ")||io[1];
  var ul=el("ul","info");
  function li(t,v){ if(!v) return; var x=el("li"); x.appendChild(el("b",null,t+" : ")); x.appendChild(document.createTextNode(v)); ul.appendChild(x); }
  li("Il part de", ent||"vos fichiers et e-mails habituels");
  li("Il vous remet", sor||"un premier jet prêt à relire");
  if(S.agent===d && S.rep.frequence) li("Pour une tâche qui revient", S.rep.frequence.toLowerCase());
  if(S.agent===d && S.rep.succes) li("Pensé pour", S.rep.succes.toLowerCase());
  li("Vous gardez la main", "rien ne part sans "+(S.agent===d&&S.rep.validation? ({"Moi":"votre validation","Mon responsable":"la validation de votre responsable","La direction":"la validation de la direction","Un comité ou un partenaire":"la validation de votre comité"})[S.rep.validation]||"votre validation" : "votre validation"));
  li("Où", "sur la plateforme Oréus, hébergée en France");
  c.appendChild(ul); return c;
}

/* ---------- questions (uniquement des choix) ---------- */
function Q(k,q,opts,multi,max){ return {k:k, ask:function(m,done){ chips(m, opts().map(function(o){ return {label:o}; }), function(r){ S.rep[k]=Array.isArray(r)? r.map(function(x){ return x.label; }).join(", ") : r.label; done(); }, multi?{multi:true,max:max||2}:{}); }, q:q}; }
var STEP={
  secteur:{k:"secteur", q:"Dans quel secteur travaillez-vous ?", ask:function(m,done){ var items=ORDER.map(function(id){ return {label:SECTEUR_LABEL[id], id:id}; }); items.push({label:"Autre secteur", id:"autre"}); chips(m, items, function(it){ S.secteur=it.id==="autre"?null:it.id; S.rep.secteur=it.label; done(); }); }},
  taille:{k:"taille", q:"Combien de personnes travaillent dans votre structure ?", ask:function(m,done){ chips(m, TAILLES.map(function(t){ return {label:t[1], id:t[0]}; }), function(it){ S.taille=it.id; S.rep.taille=it.label; done(); }); }},
  role:{k:"role", q:"Quel est votre rôle ?", ask:function(m,done){
    var dirs={}; (sec()?sec().douleurs:[]).forEach(function(d){ dirs[d.direction]=1; });
    var items=ROLES.filter(function(r){ return !sec() || r[2].some(function(x){ return dirs[x]; }); }).map(function(r){ return {label:r[1], id:r[0], dirs:r[2]}; });
    items.push({label:"Autre rôle", id:"autre", dirs:[]});
    chips(m, items, function(it){ S.role=it; S.rep.role=it.label; done(); }); }},
  situation:{k:"situation", q:"Laquelle de ces situations vous parle le plus ?", ask:function(m,done){
    var all=pistes(), first=all.slice(0,4);
    function propose(mm, list, last){
      var items=list.map(function(d){ return {label:d.nom, detail:trunc(d.scene,170), d:d}; });
      items.push({label:last?"Aucune ne correspond vraiment":"Aucune de celles-ci", exclusive:true, none:true});
      chips(mm, items, function(it){
        if(it.none){
          var rest=all.filter(function(d){ return list.indexOf(d)<0 && first.indexOf(d)<0; }).slice(0,4);
          if(!last && rest.length){ propose(bot("Et parmi celles-ci ?"), rest, true); return; }
          S.nonReconnu=true; S.agent=all[0]; S.rep.situation="aucune reconnue (agent par défaut : "+all[0].nom+")"; done(); return;
        }
        S.agent=it.d; S.rep.situation=it.d.nom; done();
      }, {col:true});
    }
    propose(m, first, false); }},
  frequence:Q("frequence","À quelle fréquence cette tâche revient-elle ?",function(){ return ["Chaque jour","Chaque semaine","Chaque mois","Quelques fois par an"]; }),
  volume:Q("volume","Combien de dossiers, documents ou demandes cela représente-t-il par mois ?",function(){ return ["Moins de 10","10 à 50","50 à 200","Plus de 200","Je ne sais pas"]; }),
  duree:Q("duree","Combien de temps prend une occurrence, du début à la fin ?",function(){ return ["Moins de 30 minutes","1 à 2 heures","Une demi-journée","Plusieurs jours","Je ne sais pas"]; }),
  charge:Q("charge","Quelle part de la semaine de votre équipe part en tâches administratives ou répétitives ?",function(){ return ["Moins de 10 %","10 à 25 %","25 à 50 %","Plus de la moitié"]; }),
  outils_tache:Q("outils_tache","Pour cette tâche, quels outils utilisez-vous ? Jusqu'à trois choix.",function(){ var dir=(S.agent&&S.agent.direction)||"operations"; return (OUTILS[dir]||OUTILS.operations).concat(["Un autre logiciel"]); }, true, 3),
  validation:Q("validation","Qui valide le résultat avant qu'il parte ?",function(){ return ["Moi","Mon responsable","La direction","Un comité ou un partenaire"]; }),
  succes:Q("succes","Dans trois mois, qu'est-ce qui ferait de cet agent une réussite ? Deux choix au plus.",function(){ return ["Gagner du temps","Moins d'erreurs","Respecter les délais","Avoir des données à jour","Libérer l'équipe pour autre chose"]; }, true, 2),
  stockage:Q("stockage","Où se trouvent principalement vos documents ? Jusqu'à trois choix.",function(){ return ["Sur les postes de travail","Sur un serveur interne","Dans un cloud (Microsoft, Google…)","Dans un logiciel métier en ligne","Sur papier","Je ne sais pas"]; }, true, 3),
  sensibles:Q("sensibles","Ces documents contiennent-ils des informations personnelles (bénéficiaires, patients, salariés, clients) ?",function(){ return ["Oui","Non","Je ne sais pas"]; }),
  hebergement:Q("hebergement","Avez-vous une exigence d'hébergement des données en France ?",function(){ return ["Oui, obligatoire","Souhaitable","Non","Je ne sais pas"]; }),
  prefere:{k:"prefere", q:"Dernière question : lequel de ces agents aimeriez-vous voir fonctionner en premier ?", ask:function(m,done){
    var all=[S.agent].concat(S.extras);
    chips(m, all.map(function(d){ return {label:d.nom, d:d}; }), function(it){ S.rep.prefere=it.d.nom; done(); }, {col:true}); }}
};
/* paliers : 5 questions → 1 agent ; 3 questions de plus → 3 agents ; dernières questions → démonstration de l'agent choisi */
var PARCOURS_FICHE=[["situation","frequence","volume","duree","charge"],["outils_tache","validation","succes"],["stockage","sensibles","hebergement","prefere"]];
var PARCOURS_LIBRE=[["secteur","taille","role","situation","frequence"],["volume","duree","outils_tache"],["stockage","sensibles","hebergement","prefere"]];

function progress(){
  var p=document.getElementById("prog"); if(!S.parcours){ p.hidden=true; return; }
  p.hidden=false; var P=S.parcours[S.palier]||[];
  document.getElementById("progtxt").textContent= S.palier>=S.parcours.length? "Terminé" : "Palier "+(S.palier+1)+" · question "+Math.min(S.idx+1,P.length)+"/"+P.length;
  p.querySelectorAll(".steps span").forEach(function(s,i){ s.className= i<S.palier || S.palier>=S.parcours.length ? "on" : ""; });
}
function next(){
  var P=S.parcours[S.palier];
  if(S.idx>=P.length){ finPalier(); return; }
  progress();
  var st=STEP[P[S.idx]], pal=S.palier, i=S.idx;
  var m=bot((S.idx+1)+"/"+P.length+" · "+st.q);
  st.ask(m, function(){ if(S.palier!==pal||S.idx!==i) return; S.idx++; next(); });
}
function finPalier(){
  var p=S.palier; S.palier++; S.idx=0; progress(); deposer();
  if(S.palier<S.parcours.length) document.getElementById("progtxt").textContent="Palier "+S.palier+" terminé";
  if(p===0){
    var m=bot(S.nonReconnu? "Merci. Voici un premier agent qu'Oréus met souvent en place dans des organisations comme la vôtre :" : "Merci. Voici votre premier agent :");
    var g=el("div","agents"); g.appendChild(agentCard(S.agent,true)); m.appendChild(g);
    teaser(m, "Encore 3 questions et nous vous proposons trois autres agents pensés pour votre activité.", "Continuer · 3 questions");
    return;
  }
  if(p===1){
    S.extras=pistes().filter(function(d){ return d.nom!==S.agent.nom; }).slice(0,3);
    var m2=bot("Voici trois agents de plus, choisis pour votre activité :");
    var g2=el("div","agents"); g2.appendChild(agentCard(S.agent,false)); S.extras.forEach(function(d){ g2.appendChild(agentCard(d,true)); }); m2.appendChild(g2);
    teaser(m2, "Plus que 4 questions : choisissez l'agent que vous aimeriez voir en premier, et nous vous en préparons la démonstration sur votre cas.", "Continuer · 4 questions");
    return;
  }
  fin();
}
function teaser(m, txt, cta){
  var t=el("div","teaser"); var b=el("b",null,txt); t.appendChild(b); m.appendChild(t);
  chips(m,[{label:cta, go:true},{label:"M'arrêter là pour l'instant"}], function(it){ if(it.go){ next(); return; } stop(); });
}
function stop(){
  S.arret=true; deposer();
  var m=bot(S.fiche? "C'est noté. Vos réponses sont bien enregistrées : l'équipe Oréus reviendra vers vous avec ces agents. Vous pouvez reprendre ici quand vous voulez avec le même lien." : "C'est noté. Pour qu'Oréus vous présente ces agents, prévenez l'équipe en un clic.");
  if(!S.fiche) boutonContact(m);
}
function fin(){
  S.phase="fin";
  var m=bot("Merci ! L'équipe Oréus prépare la démonstration de l'agent « "+S.rep.prefere+" » à partir de vos réponses, et revient vers vous pour vous la montrer.");
  if(!S.fiche) boutonContact(m);
}

/* ---------- transmission à l'équipe Oréus (le cahier des charges n'est jamais affiché au client) ---------- */
function cahier(){
  var s=sec(), d=S.agent||{}, fi=S.fiche;
  var L=["CAHIER DES CHARGES · POUR L'ÉQUIPE ORÉUS","Palier atteint : "+Math.min(S.palier,3)+"/3"+(S.arret?" (la personne s'est arrêtée là)":"")];
  if(fi) L.push("Organisation : "+fi.entreprise+" (SIREN "+fi.siren+") · code "+fi.code+(fi.source?" · "+fi.source:""));
  L.push("Secteur : "+(s?s.nom:(fi&&fi.reclassement?fi.reclassement:"autre"))+" · Taille : "+(S.taille||"?")+" · Rôle : "+(S.role?S.role.label:"?"));
  L.push("Tâche : "+(d.nom||"?")+(S.nonReconnu?" (aucune situation reconnue : agent proposé par défaut)":""));
  L.push("Agent proposé : « "+(d.nom||"?")+" » · "+(BRIQUE[d.brique_oreus]||"Vox Studio"));
  L.push("Entrées : "+(((d.entrees||[]).map(function(e){return e.nom;}).join(", "))||"à préciser"));
  L.push("Sortie : "+(((d.sorties||[]).map(function(e){return e.nom;}).join(", "))||"à préciser"));
  if(S.extras.length) L.push("Autres agents présentés : "+S.extras.map(function(x){ return x.nom; }).join(" · "));
  if(S.rep.prefere) L.push("Agent à démontrer en premier : « "+S.rep.prefere+" »");
  var ks=Object.keys(LABELS).filter(function(k){ return S.rep[k] && ["secteur","taille","role","situation","prefere"].indexOf(k)<0; });
  if(ks.length){ L.push(""); L.push("CADRAGE (déclaré par la personne)"); ks.forEach(function(k){ L.push("- "+LABELS[k]+" : "+S.rep[k]); }); L.push(""); }
  if(/^Oui/.test(S.rep.sensibles||"")) L.push("Données personnelles : oui → anonymisation ou pseudonymisation avant traitement, analyse d'impact à envisager avec le délégué à la protection des données.");
  if(/obligatoire/.test(S.rep.hebergement||"")) L.push("Hébergement : en France obligatoire → infrastructure Oréus en France (à confirmer pour chaque brique).");
  L.push("Lignes rouges : "+LIGNES_ROUGES.join(" "));
  L.push("Points ouverts : exemples de documents à demander en rendez-vous ; processus à confirmer ; partie technique à voir avec l'informatique.");
  L.push("Gain : à mesurer après la mise en service.");
  return L.join("\n");
}
/* dépôt chez Oréus à chaque palier (fonction publique forge_soumettre : n'accepte qu'un code FORGE valide et complète le même cahier) */
var EQUIPE="salvosuzon@gmail.com";
var DEPOT={url:"https://dbcwiopveyjvkmjeqsmy.supabase.co/rest/v1/rpc/forge_soumettre", cle:"sb_publishable_6mpwzl8F-TKJRqu74VLZ5g_ggEil0k-"};
function deposer(){
  var fi=S.fiche; if(!fi||!fi.code) return;
  var cad={}; Object.keys(S.rep).forEach(function(k){ cad[k]=S.rep[k]; }); cad.palier=Math.min(S.palier,3); if(S.arret) cad.arret=true;
  S.envoi=fetch(DEPOT.url,{method:"POST",headers:{"apikey":DEPOT.cle,"Authorization":"Bearer "+DEPOT.cle,"Content-Type":"application/json"},
    body:JSON.stringify({p_code:fi.code, p_texte:cahier(), p_cadrage:cad, p_agent:S.agent?S.agent.nom:null})})
    .then(function(r){ return r.ok? r.json() : null; }).then(function(d){ return !!(d&&d.ok); }).catch(function(){ return false; });
}
/* sans code : un court message (pas le cahier) est préparé dans la messagerie de la personne, rien ne part sans elle */
function boutonContact(m){

}
